# Render Blueprint — ElectroHub API
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then Render → New → Blueprint → pick the repo.
# Render reads this file and provisions the service below.
# Secrets marked `sync: false` (MONGODB_URI_ATLAS) are prompted for / set in the dashboard.

services:
  - type: web
    name: electrohub-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: atlas
      - key: MONGODB_URI_ATLAS
        sync: false
      - key: MONGODB_DB_NAME
        value: electrohub_nosql
      - key: API_V1_PREFIX
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: '["https://ecathub.netlify.app"]'
