{% extends "base.html" %}
{% block content %}
<h1>{{ 'Edit Product' if is_edit else 'New Product' }}</h1>
<div class="panel">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Name</label>
        <input name="name" value="{{ product.name if product and product.name else '' }}" required>
        <label>Slug</label>
        <input name="slug" value="{{ product.slug if product and product.slug else '' }}">
        <label>Brand (slug)</label>
        <input name="brand" value="{{ product.brand.slug if product and product.brand else '' }}" required>
        <label>Category (slug)</label>
        <input name="category" value="{{ product.category.slug if product and product.category else '' }}" required>
        <label>Price</label>
        <input type="number" step="0.01" name="price" value="{{ product.price if product and product.price is not none else '' }}" required>
        <label>Discount Price</label>
        <input type="number" step="0.01" name="discount_price" value="{{ product.discount_price if product and product.discount_price is not none else '' }}">
        <label>Stock</label>
        <input type="number" name="stock" value="{{ product.stock if product and product.stock is not none else '0' }}">
        <label>Image URLs (comma separated)</label>
        <textarea name="image_urls">{{ product.images|join(', ') if product and product.images else '' }}</textarea>
        <div class="row" style="margin-top:12px">
            <label><input type="checkbox" name="is_active" {% if not product or product.is_active %}checked{% endif %}> Active</label>
            <label><input type="checkbox" name="is_featured" {% if product and product.is_featured %}checked{% endif %}> Featured</label>
        </div>
        <button style="margin-top:12px">Save</button>
        <a href="/admin/products"><button type="button" class="secondary">Cancel</button></a>
    </form>
</div>
{% endblock %}
