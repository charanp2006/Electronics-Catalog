{% extends "base.html" %}
{% block content %}
<h1>Reviews</h1>
<div class="panel">
    <table>
        <thead><tr><th>Product</th><th>User</th><th>Rating</th><th>Comment</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
            {% for r in reviews['items'] %}
            <tr>
                <td>{{ r.product_name }}</td>
                <td>{{ r.username }}</td>
                <td>{{ r.rating }}</td>
                <td>{{ r.comment }}</td>
                <td>{{ r.status }}</td>
                <td>
                    <form method="post" action="/admin/reviews/{{ r.product_id }}/{{ r.review_id }}/toggle" style="display:inline">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <button class="secondary">{{ 'Hide' if r.status=='published' else 'Publish' }}</button>
                    </form>
                    <form method="post" action="/admin/reviews/{{ r.product_id }}/{{ r.review_id }}/delete" style="display:inline" onsubmit="return confirm('Delete?')">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <button class="secondary">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
