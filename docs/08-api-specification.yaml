openapi: 3.0.0
info:
  title: ElectroHub NoSQL API
  description: REST API for ElectroHub Electronics Catalog (MongoDB + FastAPI)
  version: 1.0.0
  contact:
    name: ABA Project
servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
tags:
  - name: Products
  - name: Categories
  - name: Brands
  - name: Auth
  - name: Cart
  - name: Wishlist
  - name: Orders
security:
  - bearerAuth: []
paths:
  /products:
    get:
      tags: [Products]
      summary: List all products (search, filter, sort, paginate)
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search query }
        - { name: category, in: query, schema: { type: string } }
        - { name: brand, in: query, schema: { type: string } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, rating_desc, newest]
            default: newest
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 12, maximum: 50 } }
      responses:
        '200':
          description: Paginated list of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductListItem' }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
  /products/featured:
    get:
      tags: [Products]
      summary: Featured products
      security: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 8 } }
      responses:
        '200':
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductListItem' }
  /products/{slug}:
    get:
      tags: [Products]
      summary: Get product details
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { description: Not found }
  /products/{slug}/related:
    get:
      tags: [Products]
      summary: Related products in the same category
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 4 } }
      responses:
        '200':
          description: Related products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductListItem' }
  /products/{slug}/reviews:
    post:
      tags: [Products]
      summary: Add a review (auth required)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, comment]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        '200':
          description: Updated product with new review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '401': { description: Not authenticated }
        '404': { description: Product not found }
  /categories:
    get:
      tags: [Categories]
      summary: List categories with product counts
      security: []
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id: { type: string }
                    name: { type: string }
                    slug: { type: string }
                    icon: { type: string }
                    product_count: { type: integer }
  /brands:
    get:
      tags: [Brands]
      summary: List brands with product counts
      security: []
      responses:
        '200':
          description: Brands
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id: { type: string }
                    name: { type: string }
                    slug: { type: string }
                    product_count: { type: integer }
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { description: Email or username already taken }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { description: Invalid credentials }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserOut' }
        '401': { description: Not authenticated }
  /cart:
    get:
      tags: [Cart]
      summary: Get current cart
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/add:
    post:
      tags: [Cart]
      summary: Add an item to the cart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemAdd' }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/update:
    put:
      tags: [Cart]
      summary: Update item quantity (0 removes)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemAdd' }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/remove/{product_id}:
    delete:
      tags: [Cart]
      summary: Remove an item
      parameters:
        - { name: product_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/clear:
    delete:
      tags: [Cart]
      summary: Clear the cart
      responses:
        '200':
          description: Empty cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /wishlist:
    get:
      tags: [Wishlist]
      summary: List wishlist products
      responses:
        '200':
          description: Wishlist
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductListItem' }
  /wishlist/add:
    post:
      tags: [Wishlist]
      summary: Add a product to the wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id: { type: string }
      responses:
        '200':
          description: Updated wishlist
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductListItem' }
  /wishlist/remove/{product_id}:
    delete:
      tags: [Wishlist]
      summary: Remove a product from the wishlist
      parameters:
        - { name: product_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Updated wishlist
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductListItem' }
  /orders:
    post:
      tags: [Orders]
      summary: Place a demo order from the cart
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: Cart empty or insufficient stock }
    get:
      tags: [Orders]
      summary: List current user's orders
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProductListItem:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        slug: { type: string }
        brand: { type: object }
        category: { type: object }
        price: { type: number }
        discount_price: { type: number, nullable: true }
        image: { type: string }
        average_rating: { type: number }
        total_reviews: { type: integer }
        stock: { type: integer }
        is_active: { type: boolean }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductListItem'
        - type: object
          properties:
            description: { type: string }
            specifications:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  value: { type: string }
            reviews:
              type: array
              items:
                type: object
                properties:
                  username: { type: string }
                  rating: { type: integer }
                  comment: { type: string }
                  created_at: { type: string, format: date-time }
            price_history:
              type: array
              items:
                type: object
                properties:
                  old_price: { type: number }
                  new_price: { type: number }
                  changed_at: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        name: { type: string }
        username: { type: string, minLength: 3 }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UserOut:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string }
        email: { type: string }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string }
        user: { $ref: '#/components/schemas/UserOut' }
    CartItemAdd:
      type: object
      required: [product_id]
      properties:
        product_id: { type: string }
        quantity: { type: integer, minimum: 1 }
    Cart:
      type: object
      properties:
        items:
          type: array
          items: { type: object }
        subtotal: { type: number }
        discount: { type: number }
        total: { type: number }
        count: { type: integer }
    Order:
      type: object
      properties:
        _id: { type: string }
        items:
          type: array
          items: { type: object }
        subtotal: { type: number }
        discount: { type: number }
        total: { type: number }
        status: { type: string }
        created_at: { type: string, format: date-time }
