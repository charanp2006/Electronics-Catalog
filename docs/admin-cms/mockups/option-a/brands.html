<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brands — Option A</title>
<link rel="stylesheet" href="../mockup.css" />
</head>
<body>
<div class="mock-ribbon">mock · option A · brands</div>

<header class="topbar">
  <div class="brand-block"><span class="logo">electrohub</span><span class="badge badge--phos">admin</span></div>
  <nav>
    <a href="dashboard.html">dashboard</a>
    <a href="products.html">products</a>
    <a href="categories.html">categories</a>
    <a href="brands.html" class="active">brands</a>
    <a href="orders.html">orders</a>
    <a href="reviews.html">reviews</a>
  </nav>
  <div class="spacer"></div>
  <span class="badge badge--dim">owner</span>
  <a class="btn btn--sm" href="login.html">logout</a>
</header>

<main class="content">
  <div class="page-head">
    <h1>brands</h1><span class="label">8 items</span>
    <div class="spacer"></div>
    <span class="label">GET /admin/brands</span>
  </div>

  <div class="panel pad-lg" style="margin-bottom:16px">
    <p class="label" style="margin:0 0 14px">[new / edit] brand</p>
    <form method="post" action="/admin/brands" onsubmit="return false">
      <input type="hidden" name="csrf_token" value="7f9c1b…a4e2" />
      <div class="grid grid-3">
        <div class="field"><label class="label" for="bname">name *</label><input id="bname" class="input" name="name" value="Apple" /></div>
        <div class="field"><label class="label" for="bslug">slug</label><span class="prefix"><span class="p">/</span><input id="bslug" class="input" name="slug" value="apple" /></span></div>
        <div class="field"><label class="label" for="bcountry">country</label><input id="bcountry" class="input" name="country" value="USA" /></div>
        <div class="field" style="grid-column:1 / -1"><label class="label" for="blogo">logo url</label><input id="blogo" class="input" name="logo" value="https://picsum.photos/seed/apple-logo/120/60" /></div>
      </div>
      <div class="row"><button class="btn btn--phos btn--sm" type="submit">save</button></div>
    </form>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th></th><th>name</th><th>slug</th><th>country</th><th class="num">products</th><th class="actions">actions</th></tr></thead>
        <tbody>
          <tr><td><img class="thumb-xs" src="https://picsum.photos/seed/apple-logo/40/20" alt="" /></td><td>Apple</td><td class="mono dim">apple</td><td class="dim">USA</td><td class="num">3</td>
            <td class="actions"><a href="javascript:void(0)">edit</a><form method="post" action="/admin/brands/x/delete" style="display:inline" onsubmit="return false"><input type="hidden" name="csrf_token" value="7f9c1b…a4e2" /><button class="btn btn--danger btn--sm" type="submit">delete</button></form></td></tr>
          <tr><td><img class="thumb-xs" src="https://picsum.photos/seed/samsung-logo/40/20" alt="" /></td><td>Samsung</td><td class="mono dim">samsung</td><td class="dim">South Korea</td><td class="num">3</td>
            <td class="actions"><a href="javascript:void(0)">edit</a><form method="post" action="/admin/brands/x/delete" style="display:inline" onsubmit="return false"><input type="hidden" name="csrf_token" value="7f9c1b…a4e2" /><button class="btn btn--danger btn--sm" type="submit">delete</button></form></td></tr>
          <tr><td><img class="thumb-xs" src="https://picsum.photos/seed/sony-logo/40/20" alt="" /></td><td>Sony</td><td class="mono dim">sony</td><td class="dim">Japan</td><td class="num">1</td>
            <td class="actions"><a href="javascript:void(0)">edit</a><form method="post" action="/admin/brands/x/delete" style="display:inline" onsubmit="return false"><input type="hidden" name="csrf_token" value="7f9c1b…a4e2" /><button class="btn btn--danger btn--sm" type="submit">delete</button></form></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
